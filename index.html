<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 Julia AI 🐱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100">
        <circle cx="50" cy="58" r="34" fill="#ffe1f2"/>
        <circle cx="50" cy="58" r="29" fill="#ffffff" stroke="#2a0518" stroke-width="3.5"/>
        <path d="M27 36 Q22 16 39 25" fill="#ffffff" stroke="#2a0518" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M73 36 Q78 16 61 25" fill="#ffffff" stroke="#2a0518" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="34" cy="62" rx="5" ry="4" fill="#ffb3da" opacity="0.9"/>
        <ellipse cx="66" cy="62" rx="5" ry="4" fill="#ffb3da" opacity="0.9"/>
        <circle cx="39" cy="54" r="2.6" fill="#2a0518"/>
        <circle cx="61" cy="54" r="2.6" fill="#2a0518"/>
        <path d="M46 66 Q50 70 54 66" fill="none" stroke="#2a0518" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="16" y1="58" x2="30" y2="59" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
        <line x1="16" y1="65" x2="30" y2="64" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
        <line x1="70" y1="59" x2="84" y2="58" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
        <line x1="70" y1="64" x2="84" y2="65" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
        <g transform="translate(73,30) rotate(15)">
          <path d="M0 0 C-13 -10 -18 2 0 6 C-18 10 -13 22 0 12 C13 22 18 10 0 6 C18 2 13 -10 0 0 Z" fill="#fe019a" stroke="#2a0518" stroke-width="2.4" stroke-linejoin="round"/>
          <circle cx="0" cy="6" r="3.4" fill="#ffffff"/>
        </g>
      </svg>
      <span class="brand-name">🐱 Julia AI 🐱</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newChatLabel">New chat</span>
    </button>

    <div class="history-label" id="recentLabel">Recent</div>
    <div class="history" id="history"></div>

    <div class="sidebar-footer" id="sidebarFooter">Made with 🐱 for you</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffe3f4" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="model-pill" id="modelPill">🐱 Julia AI 🐱 · your kitty companion</span>
      <div class="topbar-right">
        <select class="lang-select" id="langSelect">
          <option value="en">🇺🇸 English</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="es">🇪🇸 Español</option>
          <option value="ko">🇰🇷 한국어</option>
        </select>
        <div class="paw-badge">🐾</div>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="hero" id="hero">
        <svg class="hero-mark" viewBox="0 0 100 100">
          <circle cx="50" cy="58" r="29" fill="#ffffff" stroke="#2a0518" stroke-width="3.5"/>
          <path d="M27 36 Q22 16 39 25" fill="#ffffff" stroke="#2a0518" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M73 36 Q78 16 61 25" fill="#ffffff" stroke="#2a0518" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <ellipse cx="34" cy="62" rx="5" ry="4" fill="#ffb3da" opacity="0.9"/>
          <ellipse cx="66" cy="62" rx="5" ry="4" fill="#ffb3da" opacity="0.9"/>
          <circle cx="39" cy="54" r="2.6" fill="#2a0518"/>
          <circle cx="61" cy="54" r="2.6" fill="#2a0518"/>
          <path d="M46 66 Q50 70 54 66" fill="none" stroke="#2a0518" stroke-width="2.6" stroke-linecap="round"/>
          <line x1="16" y1="58" x2="30" y2="59" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
          <line x1="16" y1="65" x2="30" y2="64" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
          <line x1="70" y1="59" x2="84" y2="58" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
          <line x1="70" y1="64" x2="84" y2="65" stroke="#2a0518" stroke-width="2" stroke-linecap="round"/>
          <g transform="translate(73,30) rotate(15)">
            <path d="M0 0 C-13 -10 -18 2 0 6 C-18 10 -13 22 0 12 C13 22 18 10 0 6 C18 2 13 -10 0 0 Z" fill="#fe019a" stroke="#2a0518" stroke-width="2.4" stroke-linejoin="round"/>
            <circle cx="0" cy="6" r="3.4" fill="#ffffff"/>
          </g>
        </svg>
        <h1 id="heroTitle">Hi, I'm 🐱 Julia AI 🐱</h1>
        <p id="heroSubtitle">Ask me anything, I'm listening with my whole bow.</p>
        <div class="chips" id="chipsRow">
          <button class="chip" data-key="chip1">✨ Fun fact</button>
          <button class="chip" data-key="chip2">🐱 Write a poem</button>
          <button class="chip" data-key="chip3">📋 Plan my day</button>
          <button class="chip" data-key="chip4">💡 Explain simply</button>
        </div>
      </div>
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="attach-preview" id="attachPreview"></div>
      <div class="composer">
        <input type="file" id="fileInput" accept="image/*" multiple hidden>
        <button class="attach-btn" id="attachBtn" type="button" aria-label="Attach a file">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea id="input" rows="1" placeholder="Message 🐱 Julia AI 🐱..."></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="disclaimer" id="disclaimerText">🐱 Julia AI 🐱 can make mistakes. Double check important info.</div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
