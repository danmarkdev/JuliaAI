<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mimi Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <div class="overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 100 100">
        <circle cx="50" cy="56" r="30" fill="#220a17" stroke="#ffe3f4" stroke-width="4"/>
        <path d="M28 34 Q24 14 40 24" fill="#220a17" stroke="#ffe3f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M72 34 Q76 14 60 24" fill="#220a17" stroke="#ffe3f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="35" cy="60" r="5" fill="#FE019A" opacity="0.85"/>
        <circle cx="65" cy="60" r="5" fill="#FE019A" opacity="0.85"/>
        <path d="M36 52 Q40 47 44 52" fill="none" stroke="#ffe3f4" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M56 52 Q60 47 64 52" fill="none" stroke="#ffe3f4" stroke-width="3.4" stroke-linecap="round"/>
        <path d="M46 64 Q50 68 54 64" fill="none" stroke="#ffe3f4" stroke-width="3.2" stroke-linecap="round"/>
        <g transform="translate(74,32) rotate(18)">
          <path d="M0 -6 L-11 -11 L-9 0 L-11 11 L0 6 L11 11 L9 0 L11 -11 Z" fill="#FE019A" stroke="#ffe3f4" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="0" cy="0" r="3.2" fill="#220a17"/>
        </g>
      </svg>
      <span class="brand-name">Mimi Chat</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span id="newChatLabel">New chat</span>
    </button>

    <div class="history-label" id="recentLabel">Recent</div>
    <div class="history" id="history"></div>

    <div class="sidebar-footer" id="sidebarFooter">Made with 🎀 for you</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Toggle menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffe3f4" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <span class="model-pill" id="modelPill">Mimi · your kitty companion</span>
      <div class="topbar-right">
        <select class="lang-select" id="langSelect">
          <option value="en">🇺🇸 English</option>
          <option value="fil">🇵🇭 Filipino</option>
          <option value="ja">🇯🇵 日本語</option>
          <option value="es">🇪🇸 Español</option>
          <option value="ko">🇰🇷 한국어</option>
        </select>
        <div class="paw-badge">🐾</div>
      </div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="hero" id="hero">
        <svg class="hero-mark" viewBox="0 0 100 100">
          <circle cx="50" cy="56" r="30" fill="#220a17" stroke="#ffe3f4" stroke-width="4"/>
          <path d="M28 34 Q24 14 40 24" fill="#220a17" stroke="#ffe3f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M72 34 Q76 14 60 24" fill="#220a17" stroke="#ffe3f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="35" cy="60" r="5" fill="#FE019A" opacity="0.85"/>
          <circle cx="65" cy="60" r="5" fill="#FE019A" opacity="0.85"/>
          <path d="M36 52 Q40 47 44 52" fill="none" stroke="#ffe3f4" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M56 52 Q60 47 64 52" fill="none" stroke="#ffe3f4" stroke-width="3.4" stroke-linecap="round"/>
          <path d="M46 64 Q50 68 54 64" fill="none" stroke="#ffe3f4" stroke-width="3.2" stroke-linecap="round"/>
          <g transform="translate(74,32) rotate(18)">
            <path d="M0 -6 L-11 -11 L-9 0 L-11 11 L0 6 L11 11 L9 0 L11 -11 Z" fill="#FE019A" stroke="#ffe3f4" stroke-width="3" stroke-linejoin="round"/>
            <circle cx="0" cy="0" r="3.2" fill="#220a17"/>
          </g>
        </svg>
        <h1 id="heroTitle">Hi, I'm Mimi</h1>
        <p id="heroSubtitle">Ask me anything — I'm listening with my whole bow.</p>
        <div class="chips" id="chipsRow">
          <button class="chip" data-key="chip1">✨ Fun fact</button>
          <button class="chip" data-key="chip2">🎀 Write a poem</button>
          <button class="chip" data-key="chip3">📋 Plan my day</button>
          <button class="chip" data-key="chip4">💡 Explain simply</button>
        </div>
      </div>
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message Mimi..."></textarea>
        <button class="send-btn" id="sendBtn" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <div class="disclaimer" id="disclaimerText">Mimi can make mistakes. Double-check important info.</div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
