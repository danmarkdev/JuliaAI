<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kitty Chat</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <button class="icon-btn" id="collapseBtn" aria-label="Collapse sidebar">&#9776;</button>
      <span class="brand">Kitty Chat</span>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <span class="plus">+</span> New chat
    </button>

    <div class="sidebar-section">
      <div class="sidebar-label">Today</div>
      <div class="sidebar-item active">
        <span class="bow-dot"></span> Kitty conversation
      </div>
    </div>

    <div class="sidebar-footer">
      <svg class="cat-icon-sm" viewBox="0 0 120 110" width="30" height="30">
        <use href="#catIcon"></use>
      </svg>
      <div class="footer-text">
        <div class="footer-title">Kitty Assistant</div>
        <div class="footer-sub">always in a bow</div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="expandBtn" aria-label="Open sidebar" hidden>&#9776;</button>
      <svg class="bow-icon" viewBox="0 0 40 28" width="18" height="18">
        <use href="#bowIcon"></use>
      </svg>
      <span class="topbar-title">Kitty <span class="accent">Chat</span></span>
    </header>

    <section class="greeting-view" id="greetingView">
      <svg class="cat-icon-lg" viewBox="0 0 120 110" width="76" height="76">
        <use href="#catIcon"></use>
      </svg>
      <h1 class="greeting-title">Hi, I'm Kitty!</h1>
      <p class="greeting-sub">What would you like to chat about today?</p>

      <div class="starters" id="starters">
        <button class="starter-card" data-text="Tell me a cute, silly story">
          <div class="starter-emoji">🌸</div>
          Tell me a cute, silly story
        </button>
        <button class="starter-card" data-text="Give me some fun facts about cats">
          <div class="starter-emoji">🐾</div>
          Give me some fun facts about cats
        </button>
        <button class="starter-card" data-text="Help me plan my day">
          <div class="starter-emoji">📝</div>
          Help me plan my day
        </button>
        <button class="starter-card" data-text="Just want to chat, nya~">
          <div class="starter-emoji">✨</div>
          Just want to chat, nya~
        </button>
      </div>
    </section>

    <section class="chat-view" id="chatView" hidden>
      <div class="chat-scroll" id="chatScroll"></div>
    </section>

    <footer class="input-bar">
      <div class="input-pill">
        <svg class="bow-icon" viewBox="0 0 40 28" width="16" height="16">
          <use href="#bowIcon"></use>
        </svg>
        <input type="text" id="chatInput" placeholder="Message Kitty..." autocomplete="off" />
        <button class="send-btn" id="sendBtn" aria-label="Send message">&#10148;</button>
      </div>
      <p class="footnote">Kitty can make mistakes, so double-check important info.</p>
    </footer>
  </main>
</div>

<!-- Reusable SVG icons -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="bowIcon">
      <path d="M18 14 C18 8 10 3 4 4 C0 4.6 0 12 4 13.6 C0 15.2 0 22.6 4 23.4 C10 24.6 18 20 18 14Z" fill="currentColor" />
      <path d="M22 14 C22 8 30 3 36 4 C40 4.6 40 12 36 13.6 C40 15.2 40 22.6 36 23.4 C30 24.6 22 20 22 14Z" fill="currentColor" />
      <circle cx="20" cy="14" r="4.2" fill="currentColor" />
    </g>
    <g id="catIcon">
      <path d="M14 40 L28 4 L46 34 Z" fill="#FFF8F5" stroke="#5A3A4A" stroke-width="3" stroke-linejoin="round" />
      <path d="M106 40 L92 4 L74 34 Z" fill="#FFF8F5" stroke="#5A3A4A" stroke-width="3" stroke-linejoin="round" />
      <path d="M20 34 L28 14 L38 30 Z" fill="#FFC2D6" />
      <path d="M100 34 L92 14 L82 30 Z" fill="#FFC2D6" />
      <ellipse cx="60" cy="62" rx="46" ry="42" fill="#FFF8F5" stroke="#5A3A4A" stroke-width="3" />
      <ellipse cx="42" cy="60" rx="3.4" ry="5" fill="#5A3A4A" />
      <ellipse cx="78" cy="60" rx="3.4" ry="5" fill="#5A3A4A" />
      <ellipse cx="30" cy="74" rx="7" ry="4.4" fill="#FFB6CE" opacity="0.8" />
      <ellipse cx="90" cy="74" rx="7" ry="4.4" fill="#FFB6CE" opacity="0.8" />
      <path d="M60 70 L56 75 L64 75 Z" fill="#FF8FA8" />
      <path d="M60 75 Q60 80 54 81" stroke="#5A3A4A" stroke-width="2.4" fill="none" stroke-linecap="round" />
      <path d="M60 75 Q60 80 66 81" stroke="#5A3A4A" stroke-width="2.4" fill="none" stroke-linecap="round" />
      <line x1="6" y1="58" x2="30" y2="60" stroke="#5A3A4A" stroke-width="2" stroke-linecap="round" />
      <line x1="6" y1="68" x2="30" y2="66" stroke="#5A3A4A" stroke-width="2" stroke-linecap="round" />
      <line x1="114" y1="58" x2="90" y2="60" stroke="#5A3A4A" stroke-width="2" stroke-linecap="round" />
      <line x1="114" y1="68" x2="90" y2="66" stroke="#5A3A4A" stroke-width="2" stroke-linecap="round" />
      <g transform="translate(60 4) scale(0.55)">
        <path d="M18 14 C18 8 10 3 4 4 C0 4.6 0 12 4 13.6 C0 15.2 0 22.6 4 23.4 C10 24.6 18 20 18 14Z" fill="#FF5C7A" />
        <path d="M22 14 C22 8 30 3 36 4 C40 4.6 40 12 36 13.6 C40 15.2 40 22.6 36 23.4 C30 24.6 22 20 22 14Z" fill="#FF5C7A" />
        <circle cx="20" cy="14" r="4.2" fill="#FF5C7A" />
      </g>
    </g>
  </defs>
</svg>

<script src="script.js"></script>
</body>
</html>
